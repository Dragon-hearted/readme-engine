<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <filter id="glow-0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feFlood flood-color="#10B981" flood-opacity="0.35" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="breathe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feFlood flood-color="#10B981" flood-opacity="0.25" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze" />
    <text x="400" y="60" text-anchor="middle" fill="#E0E0E0" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" filter="url(#glow-0)">ReadmeEngine</text>
  </g>
  <line x1="340" y1="74" x2="460" y2="74" stroke="#10B981" stroke-width="2" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.6s" begin="0.3s" fill="freeze" />
  </line>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze" />
    <text x="400" y="107" text-anchor="middle" fill="#9CA3AF" font-family="Inter, system-ui, sans-serif" font-size="15">
      <tspan x="400" dy="0">Drift-aware README generator for the monorepo</tspan>
    </text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze" />
    <rect x="244.5" y="121" width="93" height="22" rx="11" fill="#6366F118" stroke="#6366F1" stroke-width="1" />
    <text x="291" y="135.5" text-anchor="middle" fill="#6366F1" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">documentation</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9s" fill="freeze" />
    <rect x="345.5" y="121" width="76" height="22" rx="11" fill="#10B98118" stroke="#10B981" stroke-width="1" />
    <text x="383.5" y="135.5" text-anchor="middle" fill="#10B981" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">automation</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1s" fill="freeze" />
    <rect x="429.5" y="121" width="126" height="22" rx="11" fill="#EF444418" stroke="#EF4444" stroke-width="1" />
    <text x="492.5" y="135.5" text-anchor="middle" fill="#EF4444" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">developer-experience</text>
  </g>
</svg>